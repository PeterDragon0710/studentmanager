<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 과제</title>
<style>
  :root{
    --bg: #EEF1ED;
    --surface: #FFFFFF;
    --surface-alt: #F7F8F5;
    --ink: #202822;
    --ink-soft: #5B665C;
    --ink-faint: #8A948B;
    --accent: #35624F;
    --accent-dark: #244638;
    --accent-soft: #DCE8E0;
    --gold: #A97C2F;
    --gold-soft: #F1E4CC;
    --danger: #B23A3A;
    --border: #DBE1D8;
    --radius-s: 8px;
    --radius-m: 14px;
    --shadow: 0 1px 2px rgba(32,40,34,0.06), 0 6px 20px rgba(32,40,34,0.06);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    line-height: 1.55;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  #app{ max-width: 480px; margin: 0 auto; }

  .msg{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-m);
    padding: 40px 24px; text-align:center; color: var(--ink-soft); font-size: 14px; box-shadow: var(--shadow);
    margin-top: 60px;
  }
  .loading{ text-align:center; color: var(--ink-faint); padding: 60px 0; font-size: 14px; }

  .header{
    background: var(--accent); color: #fff; border-radius: var(--radius-m);
    padding: 22px 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .student-name{ font-size: 21px; font-weight: 800; margin-bottom: 4px; }
  .teacher-name{ font-size: 12.5px; color: rgba(255,255,255,0.8); font-weight: 600; }

  .section-title{ font-size: 12.5px; font-weight: 800; color: var(--ink-soft); margin: 22px 4px 10px; }
  .section-title:first-of-type{ margin-top: 4px; }

  .list{ display:flex; flex-direction:column; gap:10px; }
  .card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-m);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .card.today{ border-color: var(--accent); background: var(--accent-soft); }
  .card-top{ display:flex; align-items:center; gap:8px; margin-bottom: 8px; flex-wrap: wrap; }
  .date{ font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .today .date{ color: var(--accent-dark); }
  .badge{
    font-size: 10.5px; font-weight: 800; color: #fff; background: var(--accent);
    padding: 2px 9px; border-radius: 999px;
  }
  .score{
    font-size: 11.5px; font-weight: 800; color: var(--accent-dark); background: #fff;
    border: 1px solid var(--accent-soft); padding: 2px 9px; border-radius: 999px; margin-left: auto;
  }
  .score.pending{ color: var(--ink-faint); background: var(--surface-alt); border-color: var(--border); }
  .score.green{ color:#1F6B3D; background:#DFF3E4; border-color:#B9E0C4; }
  .score.yellow{ color:#8A5A18; background:#FCEFDD; border-color:#EFCB98; }
  .score.red{ color:#B23A3A; background:#FBE9E9; border-color:#F0C9C9; }
  .content{ font-size: 13.5px; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .comment{
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 12.5px; color: var(--accent-dark);
  }
  .comment b{ font-weight: 800; }

  .warning-banner{
    border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 18px; font-size: 13px;
    font-weight: 700; line-height: 1.6; box-shadow: var(--shadow);
  }
  .warning-banner.caution{ background: #FCEFDD; color: #8A5A18; border: 1px solid #EFCB98; }
  .warning-banner.danger{ background: #FBE9E9; color: var(--danger); border: 1px solid #F0C9C9; }
  .warning-banner.good{ background: #DFF3E4; color: #1F6B3D; border: 1px solid #B9E0C4; }

  .updated{ text-align:center; color: var(--ink-faint); font-size: 11px; margin-top: 26px; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>

<script>
(async function(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const teacherId = params.get('teacher');
  const studentId = params.get('student');

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function weekdayLabel(dateStr){
    const names = ['일','월','화','수','목','금','토'];
    const d = new Date(String(dateStr) + 'T00:00:00');
    if(isNaN(d.getTime())) return '';
    return names[d.getDay()];
  }
  function formatUpdatedAt(iso){
    if(!iso) return '-';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '-';
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function scoreBadge(score){
    if(score == null) return '<span class="score pending">평가 전</span>';
    const n = score === '과제안함' ? 0 : Number(score);
    const cls = n >= 80 ? 'green' : (n >= 60 ? 'yellow' : 'red');
    const label = score === '과제안함' ? '과제안함' : `${escapeHtml(score)}점`;
    return `<span class="score ${cls}">${label}</span>`;
  }
  function recentMonthAverage(records){
    const cutoff = Date.now() - 30*24*60*60*1000;
    const recent = (records || []).filter(r => {
      const t = new Date(String(r.date) + 'T00:00:00').getTime();
      return !isNaN(t) && t >= cutoff;
    });
    const scores = recent.filter(r => r.score != null).map(r => r.score === '과제안함' ? 0 : Number(r.score));
    if(!scores.length) return null;
    return scores.reduce((a,b) => a+b, 0) / scores.length;
  }
  function warningBanner(records){
    const avg = recentMonthAverage(records);
    if(avg == null) return '';
    if(avg < 60){
      return `<div class="warning-banner danger">최근 과제 성실도가 매우 '위험'합니다. 지속될 경우 추가 등원 및 학부모상담이 이뤄질 수 있으므로 각별히 신경써주세요.</div>`;
    }
    if(avg < 80){
      return `<div class="warning-banner caution">최근 과제 성실도가 다소 미흡하여 '주의' 단계입니다. 과제에 조금 더 신경 써주세요.</div>`;
    }
    return `<div class="warning-banner good">최근 한달간 과제를 매우 성실하게 잘 해오고 있어요!</div>`;
  }
  function showMessage(text){
    app.innerHTML = `<div class="msg">${escapeHtml(text)}</div>`;
  }

  if(!teacherId || !studentId){
    showMessage('링크가 올바르지 않습니다. 선생님께 다시 링크를 요청해주세요.');
    return;
  }

  try{
    const res = await fetch(`homework/${encodeURIComponent(teacherId)}.json?t=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error('not found');
    const data = await res.json();
    const student = (data.students || []).find(s => s.linkId === studentId);
    if(!student){
      showMessage('과제 정보를 찾을 수 없습니다. 선생님께 문의해주세요.');
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    const records = (student.records || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const todayRecords = records.filter(r => r.date === today);
    const pastRecords = records.filter(r => r.date !== today);

    const renderCard = r => `
      <div class="card ${r.date === today ? 'today' : ''}">
        <div class="card-top">
          <span class="date">${escapeHtml(r.date)}${weekdayLabel(r.date) ? ` (${weekdayLabel(r.date)})` : ''}</span>
          ${r.date === today ? '<span class="badge">오늘 과제</span>' : ''}
          ${scoreBadge(r.score)}
        </div>
        <div class="content">${escapeHtml(r.content) || '(내용 없음)'}</div>
        ${r.comment ? `<div class="comment"><b>선생님 코멘트</b> · ${escapeHtml(r.comment)}</div>` : ''}
      </div>`;

    app.innerHTML = `
      <div class="header">
        <div class="student-name">${escapeHtml(student.name)}</div>
        <div class="teacher-name">${escapeHtml(data.teacherName || '')} 선생님 · ${escapeHtml(student.day || '')} ${escapeHtml(student.part || '')}</div>
      </div>
      ${warningBanner(student.records)}
      ${todayRecords.length ? `
        <div class="section-title">오늘 과제</div>
        <div class="list">${todayRecords.map(renderCard).join('')}</div>
      ` : ''}
      <div class="section-title">지난 과제</div>
      <div class="list">
        ${pastRecords.length ? pastRecords.map(renderCard).join('') : '<div class="msg" style="margin-top:0; padding:24px;">아직 지난 과제 기록이 없습니다.</div>'}
      </div>
      <div class="updated">마지막 업데이트: ${formatUpdatedAt(data.updatedAt)}</div>
    `;
  }catch(e){
    showMessage('과제 정보를 불러오지 못했습니다. 인터넷 연결을 확인하시고 잠시 후 다시 시도해주세요.');
  }
})();
</script>
</body>
</html>
